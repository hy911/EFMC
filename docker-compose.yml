# =============================================================================
# 生产部署（海外 VPS，前置 Cloudflare）
#
# 首次部署 / 更新部署统一用 ./deploy.sh，等价于：
#   1. docker compose up -d postgres          # 先起数据库
#   2. docker compose build app               # host 网络构建（迁移 + 预渲染需连库）
#   3. docker compose up -d                   # 起应用
#
# 环境变量放同目录 .env（参考 .env.example）；生产 DATABASE_URL 的主机名用
# 服务名 postgres，例如 postgres://payload:<密码>@postgres:5432/efmc
# =============================================================================

services:
  app:
    build:
      context: .
      # 构建阶段通过宿主机 127.0.0.1:5432 访问 postgres 容器（下方端口只绑本机）
      network: host
      args:
        DATABASE_URL: postgres://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:?set in .env}@127.0.0.1:5432/${POSTGRES_DB:-efmc}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # NEXT_PUBLIC_* 构建期就要，必须传进 build args（不能只靠运行时 env_file）
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        # 部署的 commit，由 deploy.sh 导出；直接 docker compose build 时留空
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    ports:
      # 只暴露给本机反代/Cloudflared；如直接用 Cloudflare 回源可改为 "3000:3000"
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    volumes:
      # 媒体上传持久化（Payload 本地存储）
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /api/health 会真去连一次库：Payload 与 Next 同进程，进程活着但连不上库时
      # 页面全是 500，只探端口通不通看不出来。
      # 探针用 node 自带的 fetch —— 镜像是 node:24-alpine，不装 curl，
      # busybox 的 wget 虽然在但不保证长期在，而 node 是 CMD 本身，一定有。
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # 冷启动要跑 Next standalone 引导 + Payload 初始化，给足时间，
      # 否则刚起来那几十秒会被判成 unhealthy
      start_period: 60s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-efmc}
    ports:
      # 仅绑定本机：给镜像构建阶段与运维排查用，不对公网暴露
      - '127.0.0.1:5432:5432'
    volumes:
      # postgres:18+ 镜像要求卷挂在 /var/lib/postgresql（数据落到其下的
      # 版本子目录），挂旧的 /var/lib/postgresql/data 会导致容器拒绝启动。
      # 参考 docker-library/postgres#1259
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-efmc}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Cloudflare Tunnel：把公网流量安全地接到 app，VPS 无需开放 80/443 端口。
  # 仅在 .env 设了 CLOUDFLARE_TUNNEL_TOKEN 时启动（deploy.sh 自动带上 tunnel profile）。
  # 在 Cloudflare 控制台 Zero Trust → Tunnels 里创建 tunnel、拿 token，
  # Public Hostname 的 Service 填 http://app:3000（cloudflared 与 app 同一 Docker 网络，
  # 用服务名 app 互通，不要用 localhost）。
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ['tunnel']
    command: tunnel --no-autoupdate run
    environment:
      # 用 :- 默认空值：cloudflared 只在 tunnel profile 启用时才起（deploy.sh 控制），
      # 避免未用 tunnel 时 compose 解析整个文件就因必填校验报错
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      # 等 app 真的能服务再接流量，别在冷启动那几十秒里把 502 送到公网
      app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
